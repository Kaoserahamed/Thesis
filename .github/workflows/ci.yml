name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep TensorFlow quiet and single-threaded inside CI runners.
env:
  TF_CPP_MIN_LOG_LEVEL: "3"
  TF_ENABLE_ONEDNN_OPTS: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint, type-check and validate generated notebooks (fast; no training).
  # ---------------------------------------------------------------------------
  lint:
    name: Lint, types and notebook validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lint.txt

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lint.txt

      - name: Check formatting (black)
        run: black --check --line-length 100 utils tests scripts

      - name: Lint (flake8)
        run: flake8 utils tests scripts

      - name: Type-check (mypy)
        run: mypy utils tests scripts

      - name: Validate generated notebooks
        run: python scripts/validate_notebooks.py

      # pip-audit has no severity filter: it exits non-zero on ANY finding, so
      # high-severity findings fail this job (and gate test/build/deploy).
      - name: Audit locked dependencies (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.lock

  # ---------------------------------------------------------------------------
  # 2. Tests -- split into a fast unit lane and a TensorFlow/model lane.
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast
            marker: "not slow"
            extra_args: "--ignore=tests/test_model_builders.py --cov-fail-under=50"
          - name: models
            marker: "requires_tensorflow"
            extra_args: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e .

      - name: Verify dependency consistency
        run: pip check

      - name: Verify lockfile is current
        run: |
          python -m pip install "pip-tools==7.6.1"
          grep -Fxq -- '-r requirements.txt' requirements-dev.txt
          pip-compile --quiet --no-upgrade --output-file=requirements.lock requirements-dev.txt
          sed -i 's/^#    pip-compile .*/#    pip-compile --output-file=requirements.lock requirements-dev.txt/' requirements.lock
          git diff --exit-code -- requirements.lock

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Run tests
        run: |
          pytest -m "${{ matrix.marker }}" ${{ matrix.extra_args }} \
            --cov=utils \
            --cov=scripts \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=reports/junit-${{ matrix.name }}.xml

      - name: Upload coverage to Codecov
        if: matrix.name == 'fast'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.name }}
          path: reports/junit-${{ matrix.name }}.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Build the distributable package and verify the artifacts.
  # ---------------------------------------------------------------------------
  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build --outdir dist

      - name: Verify wheel contents
        run: python scripts/verify_dist.py dist

      - name: Install the built wheel (no dependencies)
        run: pip install --no-deps dist/*.whl

      - name: Upload distribution artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------------
  # 4. Dependency / security audit.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run pip-audit
        run: pip install pip-audit && pip-audit -r requirements.lock

  # ---------------------------------------------------------------------------
  # 5. Deploy prediction map to GitHub Pages after the main-branch CI gates.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy prediction map
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, build]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
