name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep TensorFlow quiet and single-threaded inside CI runners.
env:
  TF_CPP_MIN_LOG_LEVEL: "3"
  TF_ENABLE_ONEDNN_OPTS: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint, type-check and validate generated notebooks (fast; no training).
  # ---------------------------------------------------------------------------
  lint:
    name: Lint, types and notebook validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black==24.10.0 flake8 mypy types-PyYAML PyYAML

      - name: Check formatting (black)
        run: black --check --line-length 100 utils tests scripts

      - name: Lint (flake8)
        run: flake8 utils tests scripts

      - name: Type-check (mypy)
        run: mypy utils tests scripts

      - name: Validate generated notebooks
        run: python scripts/validate_notebooks.py

  # ---------------------------------------------------------------------------
  # 2. Tests -- split into a fast unit lane and a TensorFlow/model lane.
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast
            pytest_args: "-m 'not slow'"
          - name: models
            pytest_args: "-m 'requires_tensorflow'"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e .

      - name: Verify dependency consistency
        run: pip check

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Run tests
        run: |
          pytest ${{ matrix.pytest_args }} \
            --cov=utils \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=reports/junit-${{ matrix.name }}.xml

      - name: Upload coverage to Codecov
        if: matrix.name == 'fast'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.name }}
          path: reports/junit-${{ matrix.name }}.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Build the distributable package and verify the artifacts.
  # ---------------------------------------------------------------------------
  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build --outdir dist

      - name: Verify wheel contents
        run: python scripts/verify_dist.py dist

      - name: Install the built wheel (no dependencies)
        run: pip install --no-deps dist/*.whl

      - name: Upload distribution artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------------
  # 4. Dependency / security audit.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt || true

  # ---------------------------------------------------------------------------
  # 5. Deploy prediction map to GitHub Pages (serves from /docs folder).
  # ---------------------------------------------------------------------------
  pages:
    name: Deploy prediction map
    runs-on: ubuntu-latest
    needs: [lint, build]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (for gh-pages)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/
          destination_dir: .
          exclude_assets: .gitkeep
