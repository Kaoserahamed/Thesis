# ---------------------------------------------------------------------------
# Linting (flake8) and static typing (mypy) configuration.
# Black formatting settings live in pyproject.toml (line-length = 100).
# NOTE: flake8 does not accept inline comments inside option values, so all
# explanatory notes are kept as full-line comments outside the options.
# ---------------------------------------------------------------------------

[flake8]
max-line-length = 100
# E203 (whitespace before ':') and W503 (line break before binary operator)
# are intentionally ignored because they conflict with Black's style.
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    archive,
    build,
    dist,
    outputs,
    data,
    .ipynb_checkpoints
# model_utils.py configures the TF/XLA environment before importing TensorFlow,
# so its imports are deliberately not at the top of the file.
per-file-ignores =
    utils/model_utils.py:E402
    utils/__init__.py:F401

[mypy]
python_version = 3.10
# Geospatial / deep-learning packages ship no (or only partial) type stubs.
ignore_missing_imports = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_configs = True
show_error_codes = True
pretty = True
exclude = (?x)(^archive/|^data/|^outputs/|^build/)

